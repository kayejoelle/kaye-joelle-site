<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaye Joëlle Creator - UGC Creator Hotels | Spa &amp; wellness | Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================= NAV -->
<header id="site-header">
  <div class="container nav-inner">
    <button class="nav-brand font-display" onclick="scrollToId('home')" id="nav-brand-btn">Kaye Joëlle Creator</button>
    <nav class="nav-links">
      <button class="nav-link" onclick="scrollToId('home')">Accueil</button>
      <button class="nav-link" onclick="scrollToId('portfolio')">Portfolio</button>
      <button class="nav-link" onclick="scrollToId('about')">À propos</button>
      <button class="nav-link" onclick="scrollToId('services')">Services</button>
      <button class="nav-link" onclick="scrollToId('contact')">Contact</button>
    </nav>
    <button class="nav-toggle" id="nav-toggle-btn" aria-label="Ouvrir le menu">☰</button>
  </div>
  <div id="mobile-menu" class="hidden">
    <button class="nav-link" onclick="scrollToId('home')">Accueil</button>
    <button class="nav-link" onclick="scrollToId('portfolio')">Portfolio</button>
    <button class="nav-link" onclick="scrollToId('about')">À propos</button>
    <button class="nav-link" onclick="scrollToId('services')">Services</button>
    <button class="nav-link" onclick="scrollToId('contact')">Contact</button>
  </div>
</header>

<!-- ============================================================= HERO -->
<section id="home" class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 class="font-display" id="hero-name"></h1>
    <p id="hero-tagline"></p>
    <div class="hero-ctas">
      <button class="btn-outline-light" onclick="scrollToId('portfolio')">Découvrir mon univers</button>
      <button class="btn-solid" onclick="scrollToId('contact')">Collaborer avec moi</button>
    </div>
  </div>
</section>

<!-- ============================================================= INTRO -->
<section class="intro-section">
  <div class="container">
    <p class="eyebrow" id="intro-eyebrow" style="margin-bottom: 1.75rem;"></p>
    <div class="intro-grid reveal">
      <div><div id="intro-media-wrap" class="intro-media"></div></div>
      <div>
        <p class="font-display" id="intro-heading"></p>
        <p id="intro-body"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============================================================= PORTFOLIO -->
<section id="portfolio" class="portfolio-section">
  <div class="container">
    <div class="portfolio-head reveal">
      <div>
        <p class="eyebrow" style="color:var(--taupe); margin-bottom:0.75rem;">N°01 — Sélection</p>
        <h2 class="font-display" style="font-weight:300; font-size:2rem; margin:0;">Portfolio éditorial</h2>
      </div>
      <div class="filter-row" id="portfolio-filters"></div>
    </div>
    <div class="masonry" id="portfolio-grid"></div>
  </div>
</section>

<!-- ============================================================= STAT -->
<section class="stat-section" id="stat-section-el">
  <div class="container stat-inner reveal">
    <p class="font-display stat-headline" id="stat-headline"></p>
    <p class="stat-body" id="stat-body"></p>
    <p class="eyebrow stat-attribution" id="stat-attribution"></p>
  </div>
</section>

<!-- ============================================================= VIDEOS -->
<section class="videos-section">
  <div class="container">
    <div class="reveal" style="margin-bottom:3rem;">
      <p class="eyebrow" id="videos-eyebrow" style="color:var(--taupe); margin-bottom:0.75rem;"></p>
      <h2 class="font-display" id="videos-heading" style="font-weight:300; font-size:2rem; max-width:32rem; margin:0;"></h2>
    </div>
    <div class="videos-grid" id="videos-grid"></div>
  </div>
</section>

<!-- ============================================================= SERVICES -->
<section id="services" class="services-section">
  <div class="container">
    <div class="reveal" style="margin-bottom:3rem;">
      <p class="eyebrow" style="color:var(--taupe); margin-bottom:0.75rem;">N°03 — Prestations</p>
      <h2 class="font-display" style="font-weight:300; font-size:2rem; margin:0;">Services</h2>
    </div>
    <div id="services-list"></div>
    <div class="hairline"></div>
  </div>
</section>

<!-- ============================================================= ABOUT -->
<section id="about" class="about-section">
  <div class="container about-grid">
    <div class="about-photo reveal" id="about-media-wrap"></div>
    <div class="reveal">
      <p class="eyebrow" style="color:var(--taupe); margin-bottom:1rem;">N°04 — À propos</p>
      <p id="about-quote"></p>
      <p id="about-body1"></p>
      <p id="about-body2"></p>
    </div>
  </div>
</section>

<!-- ============================================================= STAT 2 -->
<section class="stat-section" id="stat2-section-el">
  <div class="container stat-inner reveal">
    <p class="font-display stat-headline" id="stat2-headline"></p>
    <p class="stat-body" id="stat2-body"></p>
    <p class="eyebrow stat-attribution" id="stat2-attribution"></p>
  </div>
</section>

<!-- ============================================================= COLLABORATIONS -->
<section class="collabs-section hidden" id="collabs-section">
  <div class="container reveal" style="margin-bottom:2.5rem;">
    <p class="eyebrow" style="color:var(--taupe); text-align:center;">Ils m'ont fait confiance</p>
  </div>
  <div class="marquee-wrap">
    <div class="marquee-track" id="collabs-marquee"></div>
  </div>
</section>

<!-- ============================================================= TESTIMONIALS -->
<section class="testimonials-section hidden" id="testimonials-section">
  <div class="testimonial-inner reveal">
    <p style="color:var(--gold); text-align:center; margin-bottom:1.5rem; font-size:1.75rem;">❝</p>
    <p id="testimonial-quote"></p>
    <p id="testimonial-meta"></p>
    <div class="testimonial-nav">
      <button onclick="shiftTestimonial(-1)" aria-label="Témoignage précédent">‹</button>
      <div id="testimonial-dots"></div>
      <button onclick="shiftTestimonial(1)" aria-label="Témoignage suivant">›</button>
    </div>
  </div>
</section>

<!-- ============================================================= CONTACT -->
<section id="contact" class="contact-section">
  <div class="container contact-grid">
    <div class="reveal">
      <p class="eyebrow" style="color:var(--gold); margin-bottom:1rem;">Contact</p>
      <h2 class="font-display" id="contact-headline"></h2>
      <div class="contact-links">
        <a id="contact-email-link" href="#">✉ <span id="contact-email-text"></span></a>
        <a id="contact-instagram-link" href="#" target="_blank" rel="noreferrer" class="hidden">◎ <span id="contact-instagram-text"></span></a>
      </div>
    </div>
    <div class="reveal">
      <div id="contact-success" class="hidden">✓ Merci, votre message a bien été noté.</div>
      <form id="contact-form" onsubmit="handleContactSubmit(event)">
        <input required placeholder="Nom" class="input-line" maxlength="200">
        <input required type="email" placeholder="Email" class="input-line" maxlength="254">
        <input placeholder="Établissement / Marque" class="input-line" maxlength="200">
        <textarea required placeholder="Votre message" rows="3" class="input-line" style="resize:none;" maxlength="5000"></textarea>
        <!-- Champ piège anti-robots : invisible et inatteignable pour une personne réelle.
             Ne jamais retirer "aria-hidden"/"tabindex" ci-dessous, c'est ce qui le rend
             invisible pour les humains tout en restant rempli par la plupart des bots. -->
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="btn-outline-light" style="width:fit-content; display:flex; align-items:center; gap:8px;">Envoyer →</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="container footer-inner">
    <p class="font-display" id="footer-name"></p>
    <p id="footer-copyright"></p>
  </div>
</footer>

<!-- ============================================================= LIGHTBOX -->
<div id="lightbox" class="hidden">
  <button id="lightbox-close" onclick="closeLightbox()" aria-label="Fermer">✕</button>
  <div id="lightbox-inner">
    <div id="lightbox-media"></div>
    <div id="lightbox-text">
      <p class="eyebrow" id="lightbox-category"></p>
      <p class="title" id="lightbox-title"></p>
      <p class="desc hidden" id="lightbox-desc"></p>
      <p class="desc hidden" id="lightbox-novideo">Aucune vidéo associée pour le moment — seul l'aperçu est disponible.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/config.js" defer></script>
<script src="js/supabaseClient.js" defer></script>
<script src="js/shared.js" defer></script>
<script src="js/db.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/cloudinary.js" defer></script>
<script src="js/site.js" defer></script>
</body>
</html>
