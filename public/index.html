<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tableau de bord — Kaye Joëlle Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Page dédiée au tableau de bord : jamais liée depuis le site public,
     exclue de l'indexation (robots.txt + balise noindex ci-dessus), et
     protégée par la connexion Supabase Auth comme le reste du dashboard. -->

<div id="lightbox" class="hidden">
  <button id="lightbox-close" onclick="closeLightbox()" aria-label="Fermer">✕</button>
  <div id="lightbox-inner">
    <div id="lightbox-media"></div>
    <div id="lightbox-text">
      <p class="eyebrow" id="lightbox-category"></p>
      <p class="title" id="lightbox-title"></p>
      <p class="desc hidden" id="lightbox-desc"></p>
      <p class="desc hidden" id="lightbox-novideo">Aucune vidéo associée pour le moment — seul l'aperçu est disponible.</p>
    </div>
  </div>
</div>

<!-- ============================================================= ADMIN -->

<div id="admin-panel" class="hidden">
  <div id="admin-backdrop" onclick="closeAdmin()"></div>
  <div id="admin-drawer"></div>
</div>

<!-- Gabarit du tableau de bord, injecté dans #admin-drawer une fois authentifié -->
<template id="admin-dashboard-template">
  <div class="admin-head">
    <h3>Tableau de bord</h3>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <button id="admin-logout-btn" class="btn-outline btn-small" type="button">Déconnexion</button>
      <button onclick="closeAdmin()" aria-label="Fermer">✕</button>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab" data-tab="general">📝 Général</button>
    <button class="admin-tab active" data-tab="projects">🗂 Portfolio</button>
    <button class="admin-tab" data-tab="media" id="tab-btn-media">🖼 Médiathèque</button>
    <button class="admin-tab" data-tab="videos" id="tab-btn-videos">🎬 Vidéos</button>
    <button class="admin-tab" data-tab="testimonials">❝ Témoignages</button>
    <button class="admin-tab" data-tab="collabs">🏛 Collaborations</button>
  </div>

  <div id="upload-errors" class="upload-errors hidden"></div>

  <!-- ---------------- GÉNÉRAL ---------------- -->
  <div id="tab-general" class="admin-tab-panel" data-tab="general">
    <p class="admin-note">Modifiez les textes du site. Cliquez sur « Enregistrer » pour appliquer et sauvegarder vos changements — ils sont écrits directement en base de données et visibles par tous vos visiteurs immédiatement.</p>

    <p class="admin-section-title">Accueil</p>
    <div class="field-gap">
      <div><label class="admin-label">Sur-titre</label><input class="admin-input" id="draft-heroEyebrow"></div>
      <div><label class="admin-label">Nom</label><input class="admin-input" id="draft-heroName"></div>
      <div><label class="admin-label">Accroche</label><textarea class="admin-input" id="draft-heroTagline" rows="2"></textarea></div>
      <div><label class="admin-label">Image ou vidéo de fond</label><div id="hero-bg-picker"></div>
        <button type="button" class="btn-outline btn-small" style="width:fit-content; margin-top:0.5rem;" onclick="deleteHeroBackground()">🗑 Retirer l'arrière-plan</button>
      </div>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Introduction</p>
    <div class="field-gap">
      <div><label class="admin-label">Sur-titre</label><input class="admin-input" id="draft-introEyebrow"></div>
      <div><label class="admin-label">Paragraphe principal</label><textarea class="admin-input" id="draft-introHeading" rows="3"></textarea></div>
      <div><label class="admin-label">Paragraphe secondaire</label><textarea class="admin-input" id="draft-introBody" rows="2"></textarea></div>
      <div><label class="admin-label">Image / vidéo</label><div id="intro-image-picker"></div></div>
      <label class="checkbox-row"><input type="checkbox" id="draft-introTall"> Format portrait (image plus haute que large)</label>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Formats verticaux (section vidéos)</p>
    <div class="field-gap">
      <div><label class="admin-label">Sur-titre</label><input class="admin-input" id="draft-videosEyebrow"></div>
      <div><label class="admin-label">Titre</label><input class="admin-input" id="draft-videosHeading"></div>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Chiffre clé (entre portfolio et vidéos)</p>
    <div class="field-gap">
      <label class="checkbox-row"><input type="checkbox" id="draft-statEnabled"> Afficher ce bloc sur le site</label>
      <div><label class="admin-label">Phrase d'accroche</label><textarea class="admin-input" id="draft-statHeadline" rows="2"></textarea></div>
      <div><label class="admin-label">Statistique / texte de contexte</label><textarea class="admin-input" id="draft-statBody" rows="2"></textarea></div>
      <div><label class="admin-label">Fonction (affichée après votre nom)</label><input class="admin-input" id="draft-statRole"></div>
      <button type="button" class="btn-outline btn-small" style="width:fit-content;" onclick="deleteStatBlock()">🗑 Vider le contenu de ce bloc</button>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">À propos</p>
    <div class="field-gap">
      <div><label class="admin-label">Citation</label><textarea class="admin-input" id="draft-aboutQuote" rows="2"></textarea></div>
      <div><label class="admin-label">Paragraphe 1</label><textarea class="admin-input" id="draft-aboutBody1" rows="3"></textarea></div>
      <div><label class="admin-label">Paragraphe 2</label><textarea class="admin-input" id="draft-aboutBody2" rows="3"></textarea></div>
      <div><label class="admin-label">Photo / vidéo</label><div id="about-image-picker"></div></div>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Satisfaction client</p>
    <div class="field-gap">
      <label class="checkbox-row"><input type="checkbox" id="draft-stat2Enabled"> Afficher ce bloc sur le site</label>
      <div><label class="admin-label">Phrase d'accroche</label><textarea class="admin-input" id="draft-stat2Headline" rows="2"></textarea></div>
      <div><label class="admin-label">Statistique / texte de contexte</label><textarea class="admin-input" id="draft-stat2Body" rows="2"></textarea></div>
      <div><label class="admin-label">Fonction (affichée après votre nom)</label><input class="admin-input" id="draft-stat2Role"></div>
      <button type="button" class="btn-outline btn-small" style="width:fit-content;" onclick="deleteStat2Block()">🗑 Vider le contenu de ce bloc</button>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Contact</p>
    <div class="field-gap">
      <div><label class="admin-label">Titre de la section</label><input class="admin-input" id="draft-contactHeadline"></div>
      <div><label class="admin-label">Email</label><input class="admin-input" id="draft-contactEmail"></div>
      <div><label class="admin-label">Instagram (identifiant, sans @)</label><input class="admin-input" id="draft-contactInstagram"></div>
    </div>

    <div class="hairline" style="padding-top:1.25rem;"></div>
    <p class="admin-section-title">Pied de page</p>
    <div class="field-gap">
      <div><label class="admin-label">Nom</label><input class="admin-input" id="draft-footerName"></div>
      <div><label class="admin-label">Mention</label><input class="admin-input" id="draft-footerCopyright"></div>
    </div>

    <div class="form-buttons">
      <button class="btn-solid btn-small" type="button" id="save-general-btn">Enregistrer les modifications</button>
    </div>
  </div>

  <!-- ---------------- PORTFOLIO ---------------- -->
  <div id="tab-projects" class="admin-tab-panel hidden" data-tab="projects">
    <form id="project-form">
      <p class="admin-section-title" id="project-form-title">Ajouter un projet</p>
      <div class="field-gap">
        <input class="admin-input" id="project-title-input" placeholder="Titre du projet">
        <select class="admin-input" id="project-category-select"></select>
        <div><p class="admin-label">Image / vidéo du projet</p><div id="project-image-picker"></div></div>
        <textarea class="admin-input" id="project-description-input" placeholder="Courte description" rows="2"></textarea>
        <label class="checkbox-row"><input type="checkbox" id="project-tall-checkbox"> Format portrait (image plus haute que large)</label>
        <p id="project-form-error" class="admin-error hidden"></p>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn-solid btn-small" id="project-submit-btn">＋ Ajouter</button>
        <button type="button" class="btn-outline btn-small hidden" id="project-cancel-btn">Annuler</button>
      </div>
    </form>

    <div class="hairline" style="padding-top:1.25rem; margin-top:1.75rem;">
      <p class="admin-section-title" id="projects-count" style="margin:1rem 0;"></p>
      <p class="admin-note">Glissez une carte (⠿) pour réordonner le portfolio.</p>
    </div>
    <div id="projects-list"></div>
  </div>

  <!-- ---------------- MÉDIATHÈQUE ---------------- -->
  <div id="tab-media" class="admin-tab-panel hidden" data-tab="media">
    <p class="admin-note">Glissez-déposez vos photos ou vidéos ici, ou cliquez pour parcourir vos fichiers. Elles sont importées sur Cloudinary et enregistrées de façon permanente dans la médiathèque.</p>
    <div class="dropzone" id="media-dropzone">
      <div>📤</div>
      <p>Glissez vos fichiers ici, ou cliquez pour parcourir (images / vidéos)</p>
      <input type="file" accept="image/*,video/*" multiple id="media-file-input">
    </div>
    <p id="media-uploading" class="hidden" style="font-size:0.72rem; opacity:0.6; margin-top:0.5rem;">Import en cours…</p>
    <p class="admin-note" style="margin-top:1rem;">Glissez une vignette pour réorganiser la médiathèque.</p>
    <div class="media-grid" id="media-grid"></div>
    <p id="media-empty" class="hidden" style="font-size:0.72rem; opacity:0.5; text-align:center; padding:2.5rem 0;">Aucun média importé pour l'instant.</p>
  </div>

  <!-- ---------------- VIDÉOS ---------------- -->
  <div id="tab-videos" class="admin-tab-panel hidden" data-tab="videos">
    <p class="admin-note">Importez des vidéos verticales (format 9:16) pour la grille du site, ou collez un lien direct.</p>
    <form id="video-form">
      <p class="admin-section-title" id="video-form-title">Ajouter une vidéo</p>
      <div class="field-gap">
        <input class="admin-input" id="video-title-input" placeholder="Titre (optionnel)">
        <div><p class="admin-label">Image de couverture (optionnel)</p><div id="video-poster-picker"></div></div>
        <div><p class="admin-label">Fichier vidéo</p><div id="video-file-picker"></div></div>
        <p id="video-form-error" class="admin-error hidden"></p>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn-solid btn-small" id="video-submit-btn">＋ Ajouter</button>
        <button type="button" class="btn-outline btn-small hidden" id="video-cancel-btn">Annuler</button>
      </div>
    </form>
    <div class="hairline" style="padding-top:1.25rem; margin-top:1.75rem;">
      <p class="admin-note">Glissez une carte (⠿) pour réordonner la grille vidéo.</p>
    </div>
    <div id="videos-list" style="margin-top:1rem;"></div>
  </div>

  <!-- ---------------- TÉMOIGNAGES ---------------- -->
  <div id="tab-testimonials" class="admin-tab-panel hidden" data-tab="testimonials">
    <form id="testimonial-form">
      <p class="admin-section-title" id="testimonial-form-title">Ajouter un témoignage</p>
      <div class="field-gap">
        <textarea class="admin-input" id="testimonial-quote-input" placeholder="Citation" rows="3"></textarea>
        <input class="admin-input" id="testimonial-name-input" placeholder="Nom / Fonction (optionnel)">
        <input class="admin-input" id="testimonial-org-input" placeholder="Établissement (optionnel)">
        <p id="testimonial-form-error" class="admin-error hidden"></p>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn-solid btn-small" id="testimonial-submit-btn">＋ Ajouter</button>
        <button type="button" class="btn-outline btn-small hidden" id="testimonial-cancel-btn">Annuler</button>
      </div>
    </form>
    <div class="hairline" style="padding-top:1.25rem; margin-top:1.75rem;">
      <p class="admin-section-title" id="testimonials-count" style="margin:1rem 0;"></p>
    </div>
    <div id="testimonials-list"></div>
  </div>

  <!-- ---------------- COLLABORATIONS ---------------- -->
  <div id="tab-collabs" class="admin-tab-panel hidden" data-tab="collabs">
    <p class="admin-note">Ajoutez les noms des hôtels, spas ou marques avec lesquels vous avez collaboré. Ils défilent automatiquement dans le bandeau du site.</p>
    <label class="checkbox-row" style="margin-bottom:1.25rem;"><input type="checkbox" id="collabs-enabled-checkbox"> Afficher cette section sur le site</label>
    <form id="collab-form" style="display:flex; gap:0.5rem; margin-bottom:1.5rem;">
      <input class="admin-input" id="collab-name-input" placeholder="Nom de l'établissement">
      <button type="submit" class="btn-solid btn-small" style="flex-shrink:0;">＋ Ajouter</button>
    </form>
    <div class="tags-wrap" id="collabs-tags"></div>
    <p id="collabs-empty" class="hidden" style="font-size:0.72rem; opacity:0.5;">Aucune collaboration ajoutée.</p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../js/config.js" defer></script>
<script src="../js/supabaseClient.js" defer></script>
<script src="../js/shared.js" defer></script>
<script src="../js/db.js" defer></script>
<script src="../js/auth.js" defer></script>
<script src="../js/cloudinary.js" defer></script>
<script src="../js/admin.js" defer></script>
<script>
  // Cette page N'A QU'UN SEUL BUT : le tableau de bord. Il s'ouvre donc
  // directement (l'écran de connexion s'affiche si la session n'est pas
  // valide — openAdmin() vérifie systématiquement l'authentification avant
  // d'afficher quoi que ce soit).
  document.addEventListener("DOMContentLoaded", function () {
    // Les scripts ci-dessus sont chargés en "defer" : ils s'exécutent tous
    // avant DOMContentLoaded, donc openAdmin() est déjà disponible ici.
    openAdmin();
  });
</script>
</body>
</html>
